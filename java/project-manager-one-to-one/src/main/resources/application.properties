# ===============================
# APPLICATION NAME
# ===============================
spring.application.name=project-manager-one-to-one

# ===============================
# MYSQL CONNECTION
# Change the password to your own MySQL password.
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/project_manager_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# update = create/update tables automatically without deleting old data.
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JSP VIEW RESOLVER
# Controller returns "login", Spring opens /WEB-INF/login.jsp
# ===============================
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# Show useful form error messages during development.
server.error.include-message=always
server.error.include-binding-errors=always
